<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJNP</title>
<meta name="theme-color" content="#2B5E45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DJNP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Every person owns one colour that follows
   them through every list, grid and timeline; loden green is the app's own voice. */
:root{
  --bg:#E9EEE8;
  --surface:#FBFCFA;
  --ink:#17211B;
  --muted:#56645B;
  --line:#D2DAD1;
  --accent:#2B5E45;
  --accent-ink:#FFFFFF;
  --warn:#A64B06;
  --warn-bg:#FBEAD6;
  --ok:#256D43;
  --ok-bg:#DFF0E4;
  --pj:#2163AB;
  --pd:#AD2A5E;
  --pp:#A85A0A;
  --pn:#6243B3;
  --font-display:"Gabarito","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101612;--surface:#19211C;--ink:#E7EDE8;--muted:#9BA99F;--line:#2B362F;
    --accent:#86CBA3;--accent-ink:#0E1711;--warn:#F2AA60;--warn-bg:#3A2A17;
    --ok:#7FCE9B;--ok-bg:#1B3325;
    --pj:#76AEEC;--pd:#EE86AE;--pp:#EBA95F;--pn:#AD97F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612;--surface:#19211C;--ink:#E7EDE8;--muted:#9BA99F;--line:#2B362F;
  --accent:#86CBA3;--accent-ink:#0E1711;--warn:#F2AA60;--warn-bg:#3A2A17;
  --ok:#7FCE9B;--ok-bg:#1B3325;
  --pj:#76AEEC;--pd:#EE86AE;--pp:#EBA95F;--pn:#AD97F0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

.p-j{--pc:var(--pj)} .p-d{--pc:var(--pd)} .p-p{--pc:var(--pp)} .p-n{--pc:var(--pn)}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:500px){.app{border-inline:1px solid var(--line)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;color:var(--accent);display:flex;align-items:baseline;gap:8px}
.brand span{font-family:var(--font-body);font-weight:500;font-size:.7rem;color:var(--muted);letter-spacing:0}
.me{display:flex;align-items:center;gap:6px}
.me-label{font-size:.75rem;color:var(--muted);margin-right:2px}
.me button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;background:color-mix(in srgb,var(--pc) 16%,var(--surface));color:var(--pc);font-family:var(--font-display);font-weight:700;font-size:.9rem;cursor:pointer;padding:0}
.me button[aria-pressed="true"]{background:var(--pc);color:var(--surface);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pc)}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:22px}
main > *{flex-shrink:0}
main:focus{outline:none}

.hero{padding-top:6px}
.hero .eyebrow{font-size:.8rem;font-weight:600;color:var(--muted)}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.3rem,11vw,3rem);line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent);display:block}

.back{font-size:.85rem;font-weight:600;text-decoration:none;margin-bottom:-14px;padding-top:4px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.view-head h1{font-family:var(--font-display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
.view-head p{color:var(--muted);font-size:.9rem;margin-top:4px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.sec-head a,.sec-head .count{font-size:.85rem;font-weight:600;white-space:nowrap}
.sec-head .count{color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle;font-family:var(--font-body)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.top-align{align-items:flex-start}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.row .s.warn{color:var(--warn);font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.time{flex:none;width:52px;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.time small{display:block;font-family:var(--font-body);font-weight:500;font-size:.72rem;color:var(--muted)}
.time.wide{width:110px}
.time.now{color:var(--accent)}
.empty{padding:14px 0;color:var(--muted);font-size:.9rem}
.big{font-family:var(--font-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px 2px 3px;border-radius:999px;background:color-mix(in srgb,var(--pc) 14%,var(--surface));color:var(--pc);white-space:nowrap}
.chip.all{--pc:var(--accent);padding-left:9px}
.chip.open{background:none;border:1px dashed var(--muted);color:var(--muted);padding-left:9px}
.chip.open.warn{border-color:var(--warn);color:var(--warn)}
.chip.off{opacity:.6}
.av{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:var(--pc);color:var(--surface);font-family:var(--font-display);font-weight:700;font-size:.72rem}
.av.lg{width:34px;height:34px;font-size:1rem}
.roles{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:7px}
.role{display:inline-flex;flex-direction:column;gap:2px}
.role small{font-size:.68rem;font-weight:600;color:var(--muted)}
.avs{display:inline-flex;gap:3px;align-items:center;min-height:24px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;border-radius:999px;padding:9px 15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.pill{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}

/* attention strip: the only element with a stripe */
.attn{display:flex;flex-direction:column;gap:8px}
.attn a{display:flex;gap:12px;align-items:center;justify-content:space-between;text-decoration:none;color:var(--ink);background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:6px 14px 14px 6px;padding:10px 12px;font-size:.9rem}
.attn a b{flex:none;color:var(--warn);font-size:.82rem}
.note{background:var(--ok-bg);border-left:5px solid var(--ok);border-radius:6px 14px 14px 6px;padding:10px 12px;font-size:.88rem}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn)}

/* who is where today */
.where{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.where div{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.where .away{background:color-mix(in srgb,var(--pc) 12%,var(--surface));border-color:color-mix(in srgb,var(--pc) 40%,var(--line))}
.where b{display:block;font-weight:600;line-height:1.2}
.where span.s{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}

/* checkbox */
.check{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;margin:0}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:7px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* inline add forms */
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.add .cats{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.field,select.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:0}
label.l{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.seg{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:inline-block;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted);background:var(--surface)}
.seg input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg.who input:checked + span{background:var(--pc);border-color:var(--pc);color:var(--surface)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:.82rem;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--warn);font-size:.85rem;font-weight:600}
.bp-add{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.bp-add .btn,.bp-add .err{grid-column:1/-1}

/* sign-in and sync */
.me a{text-decoration:none}
.sync{font-size:.72rem;font-weight:600;color:var(--muted)}
.sync.error,.sync.offline{color:var(--warn)}
button.sync{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.gate{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
.gate h1{font-family:var(--font-display);font-weight:800;font-size:2.6rem;letter-spacing:-.02em;color:var(--accent);line-height:1}
.gate p{color:var(--muted)}
.gate form{display:flex;flex-direction:column;gap:12px}
.account{display:flex;flex-direction:column;gap:10px}

/* photos */
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph{width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--bg);cursor:pointer;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--warn-bg);color:var(--warn);padding:4px}
.ph.pdf b{font-size:.8rem}
.ph.pdf small{font-size:.6rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ph-cam{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.ph-cam svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.bp-row{border-left:4px solid transparent;padding-left:8px;margin-left:-10px;flex-wrap:wrap}
.bp-warn{flex-basis:100%;font-size:.85rem;font-weight:600;color:#A3281C;background:#FADBD8;border-radius:10px;padding:8px 10px;margin-top:-2px}
.bp-row.bp-green{border-left-color:var(--ok)}
.bp-row.bp-yellow{border-left-color:#C99A06}
.bp-row.bp-red{border-left-color:#C0392B}
.bp-pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;vertical-align:middle}
.bp-pill.bp-green{background:var(--ok-bg);color:var(--ok)}
.bp-pill.bp-yellow{background:#FFF3C4;color:#7A5B00}
.bp-pill.bp-red{background:#FADBD8;color:#A3281C}
.ph-wait{display:block;width:100%;height:100%;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.viewer img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:12px;background:var(--bg)}
.doc-acts{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

/* countdown */
.cd{flex:none;width:76px;text-align:center;border-radius:12px;padding:7px 4px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);line-height:1.1}
.cd b{display:block;font-family:var(--font-display);font-weight:800;font-size:1.55rem;font-variant-numeric:tabular-nums}
.cd b.txt{font-size:1.1rem;padding:4px 0}
.cd small{font-size:.66rem;font-weight:600}
.cd.soon{background:var(--warn-bg);color:var(--warn)}
.cd.late{background:var(--warn);color:var(--surface)}
.cd.ok{background:var(--ok-bg);color:var(--ok)}

/* pets */
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pet{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.pet svg{flex:none;width:24px;height:24px;color:var(--accent);fill:currentColor}
.pet b{display:block;font-family:var(--font-display);font-weight:700;line-height:1.1}
.pet span{font-size:.75rem;color:var(--muted)}

/* house sitting */
.sit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sit-head b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.sit-head span.s{font-size:.85rem;color:var(--muted)}
.sit h3{font-size:.82rem;font-weight:700;color:var(--muted)}
.nights{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.night{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 7px;border-radius:12px;border:1.5px solid transparent;cursor:pointer;background:color-mix(in srgb,var(--pc) 18%,var(--surface));color:var(--ink);line-height:1.2}
.night small{font-size:.68rem;color:var(--muted)}
.night b{font-size:.82rem;font-variant-numeric:tabular-nums;font-weight:600}
.night i{font-style:normal;font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--pc)}
.night.none{background:none;border:1.5px dashed var(--warn)}
.night.none i{color:var(--warn)}
.night.conflict{box-shadow:0 0 0 2px var(--warn)}
.todo .row{padding:8px 0}

/* timeline */
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 0 10px}
.tl{display:grid;grid-auto-rows:auto;row-gap:4px;width:max-content;padding-right:10px}
.tl-name{position:sticky;left:0;z-index:3;background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;font-size:.82rem;font-weight:600;height:30px}
.tl-corner{position:sticky;left:0;z-index:3;background:var(--surface)}
.tl-month{font-size:.7rem;font-weight:700;color:var(--muted);white-space:nowrap;padding-left:3px;height:16px}
.tl-day{text-align:center;font-size:.66rem;color:var(--muted);line-height:1.1;padding-bottom:3px}
.tl-day b{display:block;font-size:.8rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.tl-day.now b{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:22px;margin:0 auto}
.tl-cell{height:30px;border-left:1px solid var(--line)}
.tl-cell.we,.tl-day.we{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tl-bar{z-index:1;height:24px;align-self:center;margin:0 2px;border-radius:8px;background:var(--pc);color:var(--surface);font-size:.72rem;font-weight:700;line-height:24px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bar.warn{background:var(--warn)}
.tl-bar.ok{background:var(--ok)}

/* more */
.linkcard{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.linkcard b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.linkcard span span{font-size:.88rem;color:var(--muted)}
.linkcard i{font-style:normal;font-size:1.4rem;color:var(--accent)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.64rem;font-weight:600;padding:2px 0;border-radius:12px;white-space:nowrap}
.tabs a i{display:grid;place-items:center;width:42px;height:28px;border-radius:999px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs svg.fill{fill:currentColor;stroke:none}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs a[aria-current="page"] i{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(460px,100%);max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--font-display);font-weight:800;font-size:1.4rem;letter-spacing:-.01em}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .field{background:var(--bg)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.summary{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.92rem}
.summary b{display:block;font-family:var(--font-display);font-size:1.05rem}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.88rem;max-width:min(400px,calc(100% - 32px));text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">DJNP</div>
    <div class="me" id="me"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Bereiche" id="tabs">
    <a href="#heute" data-view="heute"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></i>Heute</a>
    <a href="#termine" data-view="termine"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></i>Termine</a>
    <a href="#essen" data-view="essen"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM3 11h18M9 7c0-1.500 1.500-1.500 1.500-3M13.500 7c0-1.500 1.500-1.500 1.500-3"/></svg></i>Essen</a>
    <a href="#einkauf" data-view="einkauf"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.600 10.200a1 1 0 0 1-1 .800H6.600a1 1 0 0 1-1-.800zM9 9l3-5 3 5"/></svg></i>Einkauf</a>
    <a href="#wer-ist-wo" data-view="wer-ist-wo"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.600-6-10a6 6 0 1 1 12 0c0 4.400-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg></i>Wer ist wo</a>
    <a href="#mehr" data-view="mehr"><i><svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.500" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.500" cy="12" r="2"/></svg></i>Mehr</a>
  </nav>
</div>
<div class="gate" id="gate"><div class="gate-box" id="gate-box"><h1>DJNP</h1><p>Einen Moment …</p></div></div>
<div class="sheet-wrap" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var APP_VERSION='22.11. 18:03';

var PEOPLE=[{id:'d',name:'Dagmar'},{id:'j',name:'Jürgen'},{id:'n',name:'Nina'},{id:'p',name:'Philip'}];
var PETS=[{name:'Ivie',kind:'Hund'},{name:'Frida',kind:'Hund'},{name:'Lilli',kind:'Schwein'}];
var CATS=['Lebensmittel','Tiere','Haushalt'];
var DOCKINDS=['Flugbuchung','Hotel','Reiseunterlagen','Reisepass','Personalausweis','Führerschein','E-Card','Versicherung','Heimtierausweis','Sonstiges'];
function sharedOwner(o){return o==='tiere'||o==='fam';}
var TODO=['Futter für Ivie, Frida und Lilli aufstocken','Futterplan und Tierarzt-Nummer hinlegen','Hausschlüssel übergeben','Mülltonnen und Post klären','Blumen gießen besprechen'];
var VIEWS=['heute','termine','essen','einkauf','wer-ist-wo','mehr','aufgaben','dokumente','privat'];
var REMIND=[[30,'30 Tage vorher'],[7,'7 Tage vorher'],[1,'1 Tag vorher'],[0,'Am Tag selbst']];
var WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
var WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var MONS=['Jän.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
var KEY='rudel-app-v1';

/* ---------- dates ---------- */
function z(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function toDate(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){var d=toDate(s);d.setDate(d.getDate()+n);return iso(d);}
function diffDays(a,b){return Math.round((toDate(b)-toDate(a))/864e5);}
function fmtDay(s){var d=toDate(s);return WD[d.getDay()]+', '+d.getDate()+'. '+MONS[d.getMonth()];}
function fmtFull(s){var d=toDate(s);return d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear();}
function fmtRel(s){var n=diffDays(today,s);if(n===0)return 'Heute';if(n===1)return 'Morgen';if(n===-1)return 'Gestern';return fmtDay(s);}
function fmtRange(a,b){if(a===b)return fmtDay(a);var x=toDate(a),y=toDate(b);if(x.getMonth()===y.getMonth())return x.getDate()+'. bis '+y.getDate()+'. '+MONS[y.getMonth()];return x.getDate()+'. '+MONS[x.getMonth()]+' bis '+y.getDate()+'. '+MONS[y.getMonth()];}
var today=iso(new Date());

/* ---------- state ---------- */
function uid(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);}}
function person(id){for(var i=0;i<PEOPLE.length;i++)if(PEOPLE[i].id===id)return PEOPLE[i];return null;}
var ALL=PEOPLE.map(function(p){return p.id;});
function mkTodo(key){return TODO.map(function(t,i){return {id:key+'-t'+i,text:t,done:false};});}

function emptyState(){return {me:null,tasks:[],appts:[],shop:[],away:[],meals:[],wishes:[],sit:{},docs:[],bp:{},bpgoal:{},notes:{}};}
function save(){saveCache();pushDiff();}

function awayOf(pid,d){
  for(var i=0;i<state.away.length;i++){var a=state.away[i];if(a.who.indexOf(pid)>-1&&a.from<=d&&d<=a.to)return a;}
  return null;
}
/* periods when both Dagmar and Jürgen are away: the house and the animals need someone */
function parentsAway(){
  var out=[],cur=null;
  for(var i=-30;i<=150;i++){
    var d=addDays(today,i);
    if(awayOf('d',d)&&awayOf('j',d)){if(!cur)cur={from:d,to:d};else cur.to=d;}
    else if(cur){out.push(cur);cur=null;}
  }
  if(cur)out.push(cur);
  return out.filter(function(p){return p.to>=today;});
}
function nightsOf(p){
  if(p.from===p.to)return [p.from];
  var out=[],n=diffDays(p.from,p.to);
  for(var i=0;i<n;i++)out.push(addDays(p.from,i));
  return out;
}
function sitOf(key){
  if(!state.sit[key])state.sit[key]={nights:{},todo:mkTodo(key)};
  return state.sit[key];
}
function sitInfo(p){
  var s=sitOf(p.from),nights=nightsOf(p),open=0,clash=[],names=[];
  nights.forEach(function(d){
    var k=s.nights[d];
    if(!k){open++;return;}
    if(names.indexOf(person(k).name)<0)names.push(person(k).name);
    var a=awayOf(k,d);if(a)clash.push({d:d,kid:k,a:a});
  });
  var a0=awayOf('d',p.from);
  return {s:s,nights:nights,open:open,clash:clash,names:names,place:a0?(a0.place||a0.label):''};
}

var state=emptyState();
var view=(location.hash||'').slice(1);if(VIEWS.indexOf(view)<0)view='heute';
var shopCat=CATS[0];

/* ---------- html helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function av(id,cls){var p=person(id);return '<span class="av p-'+id+(cls?' '+cls:'')+'" aria-hidden="true">'+p.name.charAt(0)+'</span>';}
function chip(id){var p=person(id);return '<span class="chip p-'+id+'">'+av(id)+esc(p.name)+'</span>';}
function whoChips(ids){
  if(ids.length===PEOPLE.length)return '<span class="chip all">Alle</span>';
  return PEOPLE.filter(function(p){return ids.indexOf(p.id)>-1;}).map(function(p){return chip(p.id);}).join('');
}
function plural(n,one,many){return n+' '+(n===1?one:many);}
var PAW='<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="5.500" cy="10.500" r="2.200"/><circle cx="9.500" cy="6.300" r="2.200"/><circle cx="14.500" cy="6.300" r="2.200"/><circle cx="18.500" cy="10.500" r="2.200"/></svg>';
var SNOUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 4c5.500 0 10 3.600 10 8s-4.500 8-10 8S2 16.400 2 12s4.500-8 10-8zM8.600 9.500c-.900 0-1.600 1.100-1.600 2.500s.700 2.500 1.600 2.500 1.600-1.100 1.600-2.500-.700-2.500-1.600-2.500zm6.800 0c-.900 0-1.600 1.100-1.600 2.500s.700 2.500 1.600 2.500S17 13.400 17 12s-.700-2.500-1.600-2.500z"/></svg>';

/* ---------- shared pieces ---------- */
function dueMs(t){var d=toDate(t.due);if(t.time){var hm=t.time.split(':');d.setHours(+hm[0],+hm[1],0,0);}return d.getTime();}
function cdInfo(t){
  if(t.done)return {big:'Fertig',unit:'erledigt',cls:'ok'};
  var n=diffDays(iso(new Date()),t.due);
  if(n<0)return {big:String(-n),unit:(n===-1?'Tag':'Tage')+' überfällig',cls:'late'};
  if(n===0){
    if(!t.time)return {big:'Heute',unit:'fällig',cls:'soon'};
    var ms=dueMs(t)-Date.now();
    if(ms<=0)return {big:'Jetzt',unit:'fällig seit '+t.time,cls:'late'};
    var mins=Math.ceil(ms/6e4),h=Math.floor(mins/60),m=mins%60;
    return h>0?{big:h+':'+z(m),unit:'Std. bis '+t.time,cls:'soon'}:{big:String(m),unit:'Min. bis '+t.time,cls:'soon'};
  }
  return {big:String(n),unit:n===1?'Tag':'Tage',cls:n<=7?'soon':''};
}
function cdInner(t){var c=cdInfo(t);return '<b'+(/^\d[\d:]*$/.test(c.big)?'':' class="txt"')+'>'+c.big+'</b><small>'+c.unit+'</small>';}
function cdBox(t){return '<div class="cd '+cdInfo(t).cls+'" data-cd="'+t.id+'">'+cdInner(t)+'</div>';}
function cdWords(t){var c=cdInfo(t);return /^\d/.test(c.big)?(c.cls==='late'?'seit '+c.big+' '+c.unit:'noch '+c.big+' '+c.unit):(c.big+' '+c.unit).toLowerCase();}
function reminderDue(t){
  if(t.done)return false;
  var n=diffDays(today,t.due);
  if(n<0)return true;
  return t.remind.some(function(r){return n<=r;});
}
function openTasks(){return state.tasks.filter(function(t){return !t.done;}).sort(function(a,b){return (a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99'));});}
function taskRow(t,full){
  var rem=REMIND.filter(function(r){return t.remind.indexOf(r[0])>-1;}).map(function(r){return r[1];});
  return '<div class="row'+(t.done?' done':'')+'">'+cdBox(t)+'<div class="grow"><div class="t">'+esc(t.title)+'</div><div class="s">Fällig '+esc(Math.abs(diffDays(today,t.due))<2?fmtRel(t.due).toLowerCase():fmtRel(t.due))+(t.time?', '+esc(t.time)+' Uhr':'')+'</div>'+
    (full?'<div class="s">'+(rem.length?'Bescheid: '+rem.join(', '):'Ohne Erinnerung')+'</div>':'')+'<div class="chips">'+whoChips(t.who)+'</div>'+
    (full?'<div class="acts"><button type="button" class="btn small ghost" style="padding-left:0" data-act="del-task" data-id="'+t.id+'" aria-label="'+esc(t.title)+' löschen">Löschen</button></div>':'')+'</div>'+
    '<input class="check" type="checkbox" id="task-'+t.id+'" data-chg="task" data-id="'+t.id+'"'+(t.done?' checked':'')+' aria-label="'+esc(t.title)+' erledigt"></div>';
}
function attention(){
  var out=[];
  openTasks().forEach(function(t){
    if(t.who.indexOf(state.me)>-1&&reminderDue(t))out.push({href:'#aufgaben',text:'Für dich: '+t.title+', '+cdWords(t)+'.',cta:'Ansehen'});
  });
  parentsAway().forEach(function(p){
    var x=sitInfo(p),parts=[];
    if(x.open)parts.push(x.nights.length===1?'Noch niemand schläft im Haus':plural(x.open,'Nacht','Nächte')+' von '+x.nights.length+' noch offen');
    x.clash.forEach(function(c){parts.push(person(c.kid).name+' ist am '+fmtDay(c.d)+' selbst weg');});
    if(parts.length)out.push({href:'#wer-ist-wo',text:fmtRange(p.from,p.to)+' ('+x.place+'): '+parts.join(', ')+'.',cta:'Einteilen'});
  });
  state.meals.forEach(function(m){
    var n=diffDays(today,m.date);
    if(n>=0&&m.inv&&m.inv[state.me]==='offen')out.push({href:'#essen',text:fmtRel(m.date)+(m.time?', '+m.time+' Uhr':'')+': '+person(m.by).name+' lädt dich zum Essen ein, es gibt '+m.dish+(hostText(m)?' ('+hostText(m).toLowerCase().replace('nina','Nina').replace('philip','Philip')+')':'')+'.',cta:'Antworten'});
    if(n<0||n>1||(m.host&&m.host!=='home'))return;
    var miss=[];if(!m.shop)miss.push('besorgt');if(!m.cook)miss.push('kocht');
    if(miss.length)out.push({href:'#essen',text:fmtRel(m.date)+', '+m.dish+': Noch offen, wer '+miss.join(' und wer ')+'.',cta:'Eintragen'});
  });
  return out;
}
function attnHtml(list){
  if(!list.length)return '';
  return '<div class="attn" aria-label="Braucht Aufmerksamkeit">'+list.map(function(a){return '<a href="'+a.href+'"><span>'+esc(a.text)+'</span><b>'+esc(a.cta)+'</b></a>';}).join('')+'</div>';
}
function apptRow(a){
  return '<div class="row">'+
    '<div class="time">'+(a.time?esc(a.time):'ganz')+'<small>'+(a.time?'Uhr':'tägig')+'</small></div>'+
    '<div class="grow"><div class="t">'+esc(a.title)+'</div>'+(a.place?'<div class="s">'+esc(a.place)+'</div>':'')+'<div class="chips">'+whoChips(a.who)+'</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><button type="button" class="btn small" data-act="cal" data-id="'+a.id+'">In Kalender</button><button type="button" class="btn small ghost" data-act="del-appt" data-id="'+a.id+'" aria-label="Termin '+esc(a.title)+' löschen">Löschen</button></div>'+
  '</div>';
}
function upcoming(){
  return state.appts.filter(function(a){return a.date>=today;}).sort(function(a,b){return (a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00'));});
}
function role(label,pid){return '<span class="role"><small>'+label+'</small>'+(pid?chip(pid):'<span class="chip open warn">offen</span>')+'</span>';}
function byTime(a,b){return (a.time||'99').localeCompare(b.time||'99');}
var RSVP={ja:'kommt',nein:'kommt nicht',offen:'noch offen'};
function hostText(m){return m.host==='n'?'Bei Nina':m.host==='p'?'Bei Philip':'';}
function mealBody(m){
  var inv=m.inv||{};
  var table=PEOPLE.filter(function(p){return m.eat.indexOf(p.id)>-1||inv[p.id]==='ja';});
  var invited=PEOPLE.filter(function(p){return inv[p.id];});
  var when=[m.time?esc(m.time)+' Uhr':'',hostText(m)].filter(Boolean).join(' · ');
  return '<div class="t">'+esc(m.dish)+'</div>'+(when?'<div class="s">'+when+'</div>':'')+
    '<div class="roles">'+(m.wish?role('Wunsch von',m.wish):'')+role('Besorgt',m.shop)+role('Kocht',m.cook)+
    '<span class="role"><small>Am Tisch</small><span class="avs">'+(table.length?table.map(function(p){return av(p.id);}).join(''):'<span class="hint">offen</span>')+'</span></span></div>'+
    (invited.length?'<div class="roles"><span class="role"><small>Eingeladen von '+esc(person(m.by||'j').name)+'</small><span class="chips" style="margin-top:0">'+invited.map(function(p){return '<span class="chip p-'+p.id+(inv[p.id]==='nein'?' off':'')+'">'+av(p.id)+esc(p.name)+': '+RSVP[inv[p.id]]+'</span>';}).join('')+'</span></span></div>':'');
}
function mealRow(m,day){
  var mine=(m.inv||{})[state.me];
  return '<div class="row top-align">'+day+'<div class="grow">'+mealBody(m)+photoStrip(m,'meal')+
    (mine?'<div class="acts"><button type="button" class="btn small'+(mine==='ja'?' primary':'')+'" id="rsvp-ja-'+m.id+'" data-act="rsvp" data-id="'+m.id+'" data-v="ja" aria-pressed="'+(mine==='ja')+'">Ich komme</button><button type="button" class="btn small'+(mine==='nein'?' primary':'')+'" id="rsvp-nein-'+m.id+'" data-act="rsvp" data-id="'+m.id+'" data-v="nein" aria-pressed="'+(mine==='nein')+'">Kann nicht</button></div>':'')+
    '<div class="acts">'+
    (m.items?(m.listed?'<span class="pill ok">Zutaten stehen auf der Liste</span>':'<button type="button" class="btn small" data-act="list-items" data-id="'+m.id+'">Zutaten auf die Liste</button>'):'')+
    photoButton('meal',m)+
    '<button type="button" class="btn small" data-act="edit-meal" data-id="'+m.id+'" aria-label="'+esc(m.dish)+' ändern">Ändern</button>'+
    '<button type="button" class="btn small ghost" data-act="del-meal" data-id="'+m.id+'" aria-label="'+esc(m.dish)+' löschen">Löschen</button></div></div></div>';
}

/* ---------- views ---------- */
function viewHeute(){
  var d=toDate(today);
  var h='<section class="hero"><p class="eyebrow">Heute</p><h1><em>'+WDL[d.getDay()]+',</em>'+d.getDate()+'. '+MON[d.getMonth()]+'</h1></section>';
  h+=attnHtml(attention());

  var ot=openTasks();
  h+='<section class="sec"><div class="sec-head"><h2>Countdown</h2><a href="#aufgaben">'+(ot.length>3?'Alle '+ot.length:'Aufgaben')+'</a></div><div class="card">'+(ot.length?ot.slice(0,3).map(function(t){return taskRow(t,false);}).join(''):'<p class="empty">Keine offenen Aufgaben mit Frist.</p>')+'</div></section>';

  h+='<section class="sec"><div class="sec-head"><h2>Wer ist wo</h2><a href="#wer-ist-wo">Planer</a></div><div class="where">';
  PEOPLE.forEach(function(p){
    var a=awayOf(p.id,today);
    h+='<div class="p-'+p.id+(a?' away':'')+'">'+av(p.id,'lg')+'<span><b>'+esc(p.name)+'</b><span class="s">'+(a?esc(a.place||a.label)+' bis '+fmtDay(a.to):(p.id==='d'||p.id==='j'?'Daheim':'Nicht verreist'))+'</span></span></div>';
  });
  h+='</div></section>';

  var meals=state.meals.filter(function(m){return m.date===today;}).sort(byTime);
  h+='<section class="sec"><div class="sec-head"><h2>Heute am Tisch</h2><a href="#essen">Essensplan</a></div><div class="card">';
  h+=meals.length?meals.map(function(m){return '<div class="row"><div class="grow">'+mealBody(m)+'</div></div>';}).join(''):'<p class="empty">Für heute ist nichts geplant.</p>';
  h+='</div></section>';

  var up=upcoming().slice(0,3);
  h+='<section class="sec"><div class="sec-head"><h2>Nächste Termine</h2><a href="#termine">Alle</a></div><div class="card">';
  h+=up.length?up.map(function(a){return '<div class="row"><div class="time wide">'+(a.time?esc(a.time):'ganztägig')+'<small>'+esc(fmtRel(a.date))+'</small></div><div class="grow"><div class="t">'+esc(a.title)+'</div><div class="chips">'+whoChips(a.who)+'</div></div></div>';}).join(''):'<p class="empty">Keine Termine eingetragen.</p>';
  h+='</div></section>';

  var todo=state.shop.filter(function(i){return !i.done;});
  h+='<section class="sec"><div class="sec-head"><h2>Einkauf</h2><a href="#einkauf">'+todo.length+' offen</a></div><div class="card">';
  h+=todo.length?'<p class="empty" style="color:var(--ink)">'+todo.slice(0,5).map(function(i){return esc(i.text);}).join(' · ')+(todo.length>5?' · und '+(todo.length-5)+' mehr':'')+'</p>':'<p class="empty">Die Liste ist leer.</p>';
  h+='</div></section>';
  return h;
}

function viewTermine(){
  var h='<div class="view-head"><div><h1>Termine</h1><p>Eintragen und in den Handy-Kalender übernehmen.</p></div><button type="button" class="btn primary" data-act="new-appt">Neu</button></div>';
  var up=upcoming();
  if(!up.length)return h+'<div class="card"><p class="empty">Noch keine Termine. Tippe auf Neu.</p></div>';
  var groups={},order=[];
  up.forEach(function(a){if(!groups[a.date]){groups[a.date]=[];order.push(a.date);}groups[a.date].push(a);});
  order.forEach(function(d){
    h+='<section class="sec"><div class="sec-head"><h2>'+esc(fmtRel(d))+'</h2>'+(diffDays(today,d)<2?'<span class="count">'+esc(fmtDay(d))+'</span>':'')+'</div><div class="card">'+groups[d].map(apptRow).join('')+'</div></section>';
  });
  return h;
}

function viewEssen(){
  var h='<div class="view-head"><div><h1>Essen</h1><p>Wer wünscht sich was, wer besorgt es, wer kocht, wer ist eingeladen.</p></div><button type="button" class="btn primary" data-act="new-meal">Neu</button></div>';
  h+='<section class="sec"><div class="sec-head"><h2>Die nächsten sieben Tage</h2></div><div class="card">';
  for(var i=0;i<7;i++){
    var d=addDays(today,i),dt=toDate(d),day='<div class="time'+(i===0?' now':'')+'">'+WD[dt.getDay()]+'<small>'+dt.getDate()+'. '+MONS[dt.getMonth()]+'</small></div>';
    var meals=state.meals.filter(function(m){return m.date===d;}).sort(byTime);
    if(!meals.length){h+='<div class="row">'+day+'<div class="grow"><div class="s">Noch nichts geplant</div></div><button type="button" class="btn small" data-act="new-meal" data-date="'+d+'" aria-label="Essen für '+fmtDay(d)+' planen">Planen</button></div>';continue;}
    meals.forEach(function(m){h+=mealRow(m,day);});
  }
  state.meals.filter(function(m){return m.date>addDays(today,6);}).sort(function(x,y){return (x.date+(x.time||'99')).localeCompare(y.date+(y.time||'99'));}).forEach(function(m){
    var mt=toDate(m.date);

function bpOf(id){if(!state.bp[id])state.bp[id]={rows:[]};return state.bp[id];}
function bpSorted(rows){return rows.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)||((b.ts||0)-(a.ts||0));});}
/* colours are an orientation against the person's own goal (default 140/90), not a medical judgement */
function bpGoal(){var g=state.bpgoal&&state.bpgoal[state.me];return g&&g.sys>0&&g.dia>0?g:{sys:140,dia:90};}
function bpClass(sys,dia,g){
  g=g||bpGoal();
  if(sys>=180||dia>=110)return {c:'red',w:'sehr hoch',warn:true};
  if(sys>=g.sys+20||dia>=g.dia+10)return {c:'red',w:'hoch'};
  if(sys>g.sys||dia>g.dia)return {c:'yellow',w:'erhöht'};
  if(sys<90||dia<60)return {c:'yellow',w:'niedrig'};
  return {c:'green',w:'im Ziel'};
}
function bpPill(k){return '<span class="bp-pill bp-'+k.c+'">'+k.w+'</span>';}
var BP_WARN='Sehr hoch: zeitnah ärztlich abklären. Bei Beschwerden wie Brustschmerz, Atemnot, Lähmungen oder Sehstörungen sofort Notruf 144 (in der EU auch 112).';
function bpAvg(rows){
  var s=bpSorted(rows).slice(0,7);
  if(!s.length)return '';
  var a=0,b=0;s.forEach(function(r){a+=r.sys;b+=r.dia;});
  return 'Schnitt der letzten '+plural(s.length,'Messung','Messungen')+': '+Math.round(a/s.length)+'/'+Math.round(b/s.length);
}
/* pdf:start */
function pdfEsc(t){return String(t).replace(/[^\x20-\xFF]/g,'?').replace(/([\\()])/g,'\\$1');}
function makePdf(pages){
  var objs=[],kids=[],i;
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach(function(c,k){
    var po=5+k*2,co=po+1;kids.push(po+' 0 R');
    objs[po]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+co+' 0 R >>';
    objs[co]='<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream';
  });
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>';
  var out='%PDF-1.4\n',offs=[];
  for(i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  var xref=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(i=1;i<objs.length;i++)out+=('0000000000'+offs[i]).slice(-10)+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  var bytes=new Uint8Array(out.length);
  for(i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
  return bytes;
}
/* rows: newest first, each {date:'YYYY-MM-DD',time,sys,dia,pulse} */
function bpPdf(name,rows,madeOn,goal){
  goal=goal||{sys:140,dia:90};
  var pages=[],c='',y=0,X=[56,160,215,305,395,445];
  function dmy(s){var a=s.split('-');return a[2]+'.'+a[1]+'.'+a[0];}
  function wd(s){var a=s.split('-').map(Number);return ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(a[0],a[1]-1,a[2]).getDay()];}
  function txt(x,yy,t,size,bold){c+='BT /'+(bold?'F2':'F1')+' '+size+' Tf '+x+' '+yy+' Td ('+pdfEsc(t)+') Tj ET\n';}
  function rule(yy,w){c+=w+' w 56 '+yy+' m 539 '+yy+' l S\n';}
  function head(){
    ['Datum','Uhrzeit','Oberer Wert','Unterer Wert','Puls','Bewertung'].forEach(function(t,i){txt(X[i],y,t,10,true);});
    y-=7;rule(y,0.8);y-=17;
  }
  function page(){
    if(c)pages.push(c);
    c='';y=786;
    c+='0.4 g\n';txt(56,40,'Blutdruck-Protokoll von '+name+', erstellt am '+dmy(madeOn)+' mit der DJNP Familien-App. Seite '+(pages.length+1),8,false);c+='0 g\n';
  }
  var a=0,b=0;rows.forEach(function(r){a+=r.sys;b+=r.dia;});
  page();
  txt(56,y,'Blutdruck-Protokoll',22,true);y-=24;
  txt(56,y,name,13,false);y-=26;
  txt(56,y,'Zeitraum: '+dmy(rows[rows.length-1].date)+' bis '+dmy(rows[0].date),10,false);y-=15;
  txt(56,y,'Messungen: '+rows.length,10,false);y-=15;
  var aS=Math.round(a/rows.length),aD=Math.round(b/rows.length);
  txt(56,y,'Durchschnitt: '+aS+'/'+aD+' mmHg ('+bpClass(aS,aD,goal).w+')',10,false);y-=15;

  head();

  });

function saveFile(name,mime,data){

  try{file=new File([blob],name,{type:mime});}catch(e){}
  if(file&&/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(function(){});
    return;

}

/* ---------- sign-in and shared storage ----------
   Every entry (a Termin, a shopping item, a meal ...) is one row in the table "items".
   After each change the app compares what it shows with what the server last confirmed
   and sends only the difference. Changes by others arrive live and are merged per entry. */
var CFG=window.RUDEL_CONFIG||{},sb=null,session=null,last={},pushing=false,pushAgain=false,syncMode='',channel=null;
var CLIENT=uid();
var LIST={appt:'appts',shop:'shop',away:'away',meal:'meals',wish:'wishes',task:'tasks',doc:'docs'};

function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(function(k){return v[k]!==undefined;}).map(function(k){return JSON.stringify(k)+':'+canon(v[k]);}).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function flatten(st){
  var m={};
  function put(id,kind,data,owner,priv,vis){m[id]={id:id,kind:kind,data:data,owner:owner||null,private:!!priv,visible_to:vis||null};}
  Object.keys(LIST).forEach(function(k){
    st[LIST[k]].forEach(function(x){
      if(k==='doc'){var pet=x.owner==='tiere'||x.owner==='fam';put(x.id,k,x,pet?null:x.owner,false,(pet||x.vis.length>=PEOPLE.length)?null:x.vis.slice().sort());}
      else if(k==='shop')put(x.id,k,x,null,false,(Array.isArray(x.vis)&&x.vis.length<PEOPLE.length)?x.vis.slice().sort():null);
      else put(x.id,k,x);
    });
  });
  Object.keys(st.sit).forEach(function(key){put('sit-'+key,'sit',{key:key,nights:st.sit[key].nights,todo:st.sit[key].todo});});
  /* private entries: only ever my own */
  if(st.me&&st.bp[st.me])st.bp[st.me].rows.forEach(function(r){put(r.id,'bp',r,st.me,true);});
  if(st.me&&st.bpgoal&&st.bpgoal[st.me])put('bpgoal-'+st.me,'bpgoal',st.bpgoal[st.me],st.me,true);
  if(st.me&&st.notes[st.me])st.notes[st.me].forEach(function(n){put(n.id,'note',n,st.me,true);});
  return m;
}
function removeFrom(st,id){
  Object.keys(LIST).forEach(function(k){st[LIST[k]]=st[LIST[k]].filter(function(x){return x.id!==id;});});
  if(id.indexOf('sit-')===0)delete st.sit[id.slice(4)];
  if(id.indexOf('bpgoal-')===0&&st.bpgoal)delete st.bpgoal[id.slice(7)];
  Object.keys(st.bp).forEach(function(p){st.bp[p].rows=st.bp[p].rows.filter(function(x){return x.id!==id;});});
  Object.keys(st.notes).forEach(function(p){st.notes[p]=st.notes[p].filter(function(x){return x.id!==id;});});
}
function applyRow(st,row){
  var d=JSON.parse(JSON.stringify(row.data));
  removeFrom(st,row.id);
  if(LIST[row.kind])st[LIST[row.kind]].push(d);
  else if(row.kind==='sit')st.sit[d.key]={nights:d.nights||{},todo:d.todo||[]};
  else if(row.kind==='bpgoal'&&row.owner){if(!st.bpgoal)st.bpgoal={};st.bpgoal[row.owner]=d;}
  else if(row.kind==='bp'&&row.owner){if(!st.bp[row.owner])st.bp[row.owner]={rows:[]};st.bp[row.owner].rows.push(d);}
  else if(row.kind==='note'&&row.owner){if(!st.notes[row.owner])st.notes[row.owner]=[];st.notes[row.owner].push(d);}
}
function sortState(st){
  function ts(x){return x.ts||0;}
  st.shop.sort(function(a,b){return ts(b)-ts(a);});
  st.wishes.sort(function(a,b){return ts(a)-ts(b);});
  Object.keys(st.notes).forEach(function(p){st.notes[p].sort(function(a,b){return ts(b)-ts(a);});});
}
/* what this device changed and the server has not confirmed yet */
function pending(st,lastMap){
  var now=flatten(st),ups=[],dels=[];
  Object.keys(now).forEach(function(id){if(lastMap[id]!==canon(now[id]))ups.push(JSON.parse(JSON.stringify(now[id])));});
  Object.keys(lastMap).forEach(function(id){if(!now[id])dels.push(id);});
  return {ups:ups,dels:dels};
}

function cacheKey(){return KEY+':'+(session&&session.user?session.user.id:'');}
function meKey(){return KEY+':me:'+(session&&session.user?session.user.id:'');}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({state:state,last:last}));}catch(e){}}
function readCache(){try{var c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c&&c.state&&Array.isArray(c.state.appts)&&c.last)return c;}catch(e){}return null;}

function setSync(mode){if(syncMode===mode)return;syncMode=mode;var el=document.getElementById('me');if(el&&state.me)el.innerHTML=syncHtml()+'<a href="#mehr" aria-label="Konto von '+person(state.me).name+'">'+av(state.me,'lg')+'</a>';}
function syncHtml(){
  if(syncMode==='saving')return '<span class="sync">Speichert …</span>';
  if(syncMode==='error')return '<button type="button" class="sync error" data-act="retry">Nicht gespeichert. Nochmal</button>';
  if(syncMode==='offline')return '<button type="button" class="sync offline" data-act="retry">Offline</button>';
  return '';
}

function pushDiff(){
  if(!sb||!session||!state.me)return;
  if(pushing){pushAgain=true;return;}
  var p=pending(state,last);
  if(!p.ups.length&&!p.dels.length){if(syncMode==='saving'||syncMode==='error')setSync('');return;}
  pushing=true;setSync('saving');
  var sig={},stamp=new Date().toISOString();
  var rows=p.ups.map(function(r){sig[r.id]=canon(r);return {id:r.id,kind:r.kind,data:r.data,owner:r.owner,private:r.private,visible_to:r.visible_to,updated_by:CLIENT,updated_at:stamp};});
  var step=rows.length?sb.from('items').upsert(rows):Promise.resolve({error:null});
  Promise.resolve(step).then(function(res){
    if(res.error)throw res.error;
    Object.keys(sig).forEach(function(id){last[id]=sig[id];});
    return p.dels.length?sb.from('items').delete().in('id',p.dels):{error:null};
  }).then(function(res){
    if(res.error)throw res.error;
    p.dels.forEach(function(id){delete last[id];});
    pushing=false;saveCache();setSync('');
    if(pushAgain){pushAgain=false;pushDiff();}
  }).catch(function(e){
    pushing=false;pushAgain=false;
    setSync(navigator.onLine===false?'offline':'error');
    if(window.console)console.error('Speichern fehlgeschlagen',e);
  });
}

/* fetch everything I am allowed to see, then put my unconfirmed changes back on top */
function refresh(){
  if(!sb||!session||!state.me)return Promise.resolve();
  var mine=pending(state,last),me=state.me;
  return Promise.resolve(sb.from('items').select('id,kind,data,owner,private,visible_to')).then(function(res){
    if(res.error)throw res.error;
    var st=emptyState();st.me=me;
    res.data.forEach(function(row){applyRow(st,row);});
    sortState(st);
    var f=flatten(st);last={};
    Object.keys(f).forEach(function(id){last[id]=canon(f[id]);});
    mine.ups.forEach(function(r){applyRow(st,r);});
    mine.dels.forEach(function(id){removeFrom(st,id);});
    sortState(st);
    state=st;setSync('');
    saveCache();render(true);pushDiff();
  }).catch(function(e){
    setSync('offline');
    if(window.console)console.error('Laden fehlgeschlagen',e);
  });
}
function subscribe(){
  if(channel||!sb)return;
  channel=sb.channel('items-live').on('postgres_changes',{event:'*',schema:'public',table:'items'},function(p){
    if(p.eventType==='DELETE'){
      var id=p.old&&p.old.id;if(!id)return;
      removeFrom(state,id);delete last[id];
    }else{
      var row=p.new;if(!row||row.updated_by===CLIENT)return;
      applyRow(state,row);sortState(state);
      var f=flatten(state)[row.id];if(f)last[row.id]=canon(f);
    }
    saveCache();render(true);
  }).subscribe();
}

var gate=document.getElementById('gate'),gateBox=document.getElementById('gate-box');
function showGate(html){gateBox.innerHTML='<h1>DJNP</h1>'+html;gate.hidden=false;}
function showLogin(msg){
  showGate('<p>Die Familien-App. Bitte melde dich an.</p><form data-form="login" novalidate>'+
    '<label class="l" for="login-email">E-Mail<input class="field" type="email" id="login-email" name="email" autocomplete="username" inputmode="email"></label>'+
    '<label class="l" for="login-pw">Passwort<input class="field" type="password" id="login-pw" name="password" autocomplete="current-password"></label>'+
    '<p class="err"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</p><button type="submit" class="btn primary">Anmelden</button></form>');
}
function doLogin(f,fail){
  var fd=new FormData(f),email=String(fd.get('email')||'').trim(),pw=String(fd.get('password')||'');
  if(!email||!pw)return fail('Bitte E-Mail und Passwort eintragen.');
  var btn=f.querySelector('button[type=submit]');btn.disabled=true;
  sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    btn.disabled=false;
    if(r.error)return fail(/invalid/i.test(r.error.message)?'E-Mail oder Passwort stimmt nicht.':'Anmelden hat nicht geklappt: '+r.error.message);
    session=r.data.session;enter();
  },function(){btn.disabled=false;fail('Keine Verbindung. Bitte prüf dein Internet.');});
}
function signOut(){
  try{localStorage.removeItem(cacheKey());localStorage.removeItem(meKey());}catch(e){}
  var done=function(){location.hash='';location.reload();};
  if(sb)sb.auth.signOut().then(done,done);else done();
}
function start(personId,cached){
  state=cached?cached.state:emptyState();
  last=cached?cached.last:{};
  state.me=personId;
  try{localStorage.setItem(meKey(),JSON.stringify({person:personId}));}catch(e){}
  gate.hidden=true;
  render(false);
  refresh();subscribe();
  checkPush();
}
function enter(){
  showGate('<p>Lade eure Daten …</p>');
  Promise.resolve(sb.from('members').select('user_id,person')).then(function(res){
    if(res.error)throw res.error;
    var mine=res.data.filter(function(m){return m.user_id===session.user.id;})[0];
    if(!mine){showGate('<p>Dieses Konto ist noch keiner Person in der Familie zugeordnet. Bitte sag Jürgen Bescheid.</p><button type="button" class="btn" data-act="logout">Abmelden</button>');return;}
    start(mine.person,readCache());
  }).catch(function(){
    /* no connection: open with what this device saw last */
    var known=null;try{known=JSON.parse(localStorage.getItem(meKey())||'null');}catch(e){}
    var cached=readCache();
    if(known&&known.person&&cached){start(known.person,cached);setSync('offline');}
    else showGate('<p>Keine Verbindung. Beim ersten Start braucht die App Internet.</p><button type="button" class="btn primary" data-act="reload">Nochmal versuchen</button>');
  });
}
function boot(){
  if(!CFG.url||!CFG.key){showGate('<p>Die App ist noch nicht mit der Datenbank verbunden.</p>');return;}
  if(!window.supabase||!window.supabase.createClient){showGate('<p>Keine Verbindung. Bitte prüf dein Internet und öffne die App noch einmal.</p><button type="button" class="btn primary" data-act="reload">Nochmal versuchen</button>');return;}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  sb.auth.getSession().then(function(r){
    session=r.data?r.data.session:null;
    if(session)enter();else showLogin();
  },function(){showLogin();});
  sb.auth.onAuthStateChange(function(ev,s){
    if(s)session=s;
    if(ev==='SIGNED_OUT'&&state.me){state=emptyState();showLogin();}
  });
}

/* ---------- photos ----------
   Pictures live in the private storage bucket "bilder" under docs/<entry id>/ or meals/<entry id>/.
   The database only lets someone see a picture if they may see the entry it belongs to,
   so a document photo is exactly as visible as the document itself. */
var BUCKET='bilder',urls={},urlBusy={},fileTarget=null;
var fileInput=document.createElement('input');
fileInput.type='file';fileInput.accept='image/*';fileInput.id='photo-file';fileInput.hidden=true;
document.body.appendChild(fileInput);

function photoList(kind){return kind==='doc'?state.docs:kind==='shop'?state.shop:state.meals;}
var PHOTO_DIR={doc:'docs/',meal:'meals/',shop:'shop/'};
function photoTitle(kind,item){return kind==='doc'?item.kind:kind==='shop'?item.text:item.dish;}
function photoStrip(item,kind){
  var ps=item.photos||[];
  if(!ps.length)return '';
  return '<div class="photos">'+ps.map(function(p,i){
    var u=urls[p.path];
    if(p.pdf)return '<button type="button" class="ph pdf" data-act="photo-open" data-kind="'+kind+'" data-id="'+item.id+'" data-i="'+i+'" aria-label="PDF '+esc(p.name||'')+' öffnen"><b>PDF</b><small>'+esc((p.name||'').replace(/\.pdf$/i,''))+'</small></button>';
    return '<button type="button" class="ph" data-act="photo-open" data-kind="'+kind+'" data-id="'+item.id+'" data-i="'+i+'" aria-label="Foto '+(i+1)+' ansehen">'+(u?'<img src="'+esc(u.url)+'" alt="">':'<span class="ph-wait"></span>')+'</button>';
  }).join('')+'</div>';
}
function canAddPhoto(kind,item){return true;}
function photoButton(kind,item){return canAddPhoto(kind,item)?'<button type="button" class="btn small" data-act="photo-add" data-kind="'+kind+'" data-id="'+item.id+'" aria-label="'+(kind==='doc'?'Foto oder PDF':'Foto')+' zu '+esc(photoTitle(kind,item))+' hinzufügen">'+(kind==='doc'?'Foto / PDF':'Foto')+'</button>':'';}

/* ask for short-lived links to the pictures on screen, then draw them */
function wantUrls(){
  if(!sb||!state.me)return;
  var now=Date.now(),need=[];
  state.docs.concat(state.meals,state.shop).forEach(function(it){(it.photos||[]).forEach(function(p){
    var u=urls[p.path];
    if((!u||u.exp<now+60000)&&!urlBusy[p.path]){need.push(p.path);urlBusy[p.path]=true;}
  });});
  if(!need.length)return;
  Promise.resolve(sb.storage.from(BUCKET).createSignedUrls(need,3600)).then(function(r){
    need.forEach(function(p){delete urlBusy[p];});
    if(r.error||!r.data)return;
    var got=false;
    r.data.forEach(function(x){if(x&&x.signedUrl&&!x.error){urls[x.path]={url:x.signedUrl,exp:Date.now()+3500000};got=true;}});
    if(got)render(true);
  },function(){need.forEach(function(p){delete urlBusy[p];});});
}

function shrinkPhoto(file){
  return new Promise(function(res,rej){
    var src=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(src);
      c.toBlob(function(b){if(b)res({blob:b,w:c.width,h:c.height});else rej(new Error('Bild konnte nicht umgewandelt werden'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(src);rej(new Error('Bild konnte nicht gelesen werden'));};
    img.src=src;
  });
}
function uploadPhoto(t,file){
  var item=byId(photoList(t.kind),t.id);if(!item)return;
  if(!sb||navigator.onLine===false){toast('Fotos brauchen eine Internetverbindung.');return;}
  var isPdf=t.kind==='doc'&&(file.type==='application/pdf'||/\.pdf$/i.test(file.name||''));
  if(isPdf&&file.size>10485760){toast('Das PDF ist größer als 10 MB und zu groß für die App.');return;}
  toast(isPdf?'PDF wird hochgeladen …':'Foto wird hochgeladen …');
  var path=PHOTO_DIR[t.kind]+t.id+'/'+uid()+(isPdf?'.pdf':'.jpg');
  (isPdf?Promise.resolve({blob:file,pdf:true}):shrinkPhoto(file)).then(function(s){
    /* the entry has to be in the database first: the storage rules check it */
    var row=flatten(state)[t.id];
    if(!row)throw new Error('Eintrag fehlt');
    return Promise.resolve(sb.from('items').upsert([{id:row.id,kind:row.kind,data:row.data,owner:row.owner,private:row.private,visible_to:row.visible_to,updated_by:CLIENT,updated_at:new Date().toISOString()}])).then(function(r){
      if(r.error)throw r.error;
      last[row.id]=canon(row);
      return sb.storage.from(BUCKET).upload(path,s.blob,{contentType:s.pdf?'application/pdf':'image/jpeg',upsert:false});
    }).then(function(r){
      if(r.error)throw r.error;
      var cur=byId(photoList(t.kind),t.id);
      if(!cur){sb.storage.from(BUCKET).remove([path]);return;}
      cur.photos=(cur.photos||[]).concat([s.pdf?{path:path,pdf:true,name:String(file.name||'Dokument.pdf').slice(0,80),by:state.me,ts:Date.now()}:{path:path,w:s.w,h:s.h,by:state.me,ts:Date.now()}]);
      urls[path]={url:URL.createObjectURL(s.blob),exp:Date.now()+3500000};
      commit();toast(s.pdf?'PDF gespeichert.':'Foto gespeichert.');
    });
  }).catch(function(e){
    toast(/lesen|umgewandelt/.test(e&&e.message)?'Dieses Bild kann die App nicht öffnen. Bitte ein Foto im JPG- oder PNG-Format wählen.':'Das Foto konnte nicht gespeichert werden.');
    if(window.console)console.error('Foto',e);
  });
}
fileInput.addEventListener('change',function(){
  var f=fileInput.files&&fileInput.files[0],t=fileTarget;fileTarget=null;
  if(f&&t)uploadPhoto(t,f);
});

function openPhoto(kind,id,i){
  var item=byId(photoList(kind),id);if(!item||!item.photos||!item.photos[i])return;
  var p=item.photos[i],u=urls[p.path],title=photoTitle(kind,item);
  openSheet('<h2 id="sheet-title">'+esc(title)+'</h2><div class="viewer">'+(p.pdf?(u?'<a class="btn primary" href="'+esc(u.url)+'" target="_blank" rel="noopener">PDF öffnen: '+esc(p.name||'Dokument')+'</a>':'<p class="hint">Das PDF wird vorbereitet …</p>'):(u?'<img src="'+esc(u.url)+'" alt="Foto: '+esc(title)+'">':'<p class="hint">Das Foto wird geladen …</p>'))+'</div>'+
    '<p class="hint">Hochgeladen von '+esc(person(p.by)?person(p.by).name:'')+(p.ts?' am '+fmtDay(iso(new Date(p.ts))):'')+'.</p>'+
    '<div class="actions">'+(canAddPhoto(kind,item)?'<button type="button" class="btn ghost" data-act="photo-del" data-kind="'+kind+'" data-id="'+id+'" data-i="'+i+'">'+(p.pdf?'PDF löschen':'Foto löschen')+'</button>':'')+'<button type="button" class="btn" data-act="close">Schließen</button></div>');
}
function deletePhoto(kind,id,i){
  var item=byId(photoList(kind),id);if(!item||!item.photos||!item.photos[i])return;
  var p=item.photos[i];
  Promise.resolve(sb.storage.from(BUCKET).remove([p.path])).then(function(r){
    if(r&&r.error)throw r.error;
    item.photos=item.photos.filter(function(x){return x.path!==p.path;});
    delete urls[p.path];
    closeSheet();commit();toast('Foto gelöscht.');
  }).catch(function(){toast('Das Foto konnte nicht gelöscht werden. Bitte prüf die Verbindung.');});
}
/* a product photo is only needed until the item is in the cart: remove it right when it is ticked off */
function dropShopPhotos(items){
  var paths=[];
  items.forEach(function(it){(it.photos||[]).forEach(function(p){paths.push(p.path);delete urls[p.path];});it.photos=[];});
  if(paths.length&&sb)Promise.resolve(sb.storage.from(BUCKET).remove(paths)).catch(function(e){if(window.console)console.error('Foto',e);});
}
function shopPhotoButton(item){
  return '<button type="button" class="ph-cam" data-act="photo-add" data-kind="shop" data-id="'+item.id+'" aria-label="Foto vom Produkt zu '+esc(item.text)+' machen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>';
}
/* deleting an entry removes its pictures first, while the entry still proves who may delete them */
function dropWithPhotos(kind,id,done){
  var item=byId(photoList(kind),id),ps=item&&item.photos||[];
  if(!ps.length||!sb){done();return;}
  Promise.resolve(sb.storage.from(BUCKET).remove(ps.map(function(p){return p.path;}))).then(function(){done();},function(){done();});
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act^="photo-"]');if(!el)return;
  var a=el.dataset.act;
  if(a==='photo-add'){
    /* newer Android only offers the gallery unless the camera is asked for explicitly, so ask which one */
    var kind=el.dataset.kind,it=byId(photoList(kind),el.dataset.id);if(!it)return;
    openSheet('<h2 id="sheet-title">'+(kind==='doc'?'Foto oder PDF':'Foto')+': '+esc(photoTitle(kind,it))+'</h2>'+
      '<div class="actions" style="flex-direction:column;align-items:stretch">'+
      '<button type="button" class="btn primary" data-act="photo-pick" data-src="camera" data-kind="'+kind+'" data-id="'+it.id+'">Foto aufnehmen</button>'+
      '<button type="button" class="btn" data-act="photo-pick" data-src="gallery" data-kind="'+kind+'" data-id="'+it.id+'">'+(kind==='doc'?'Aus Galerie oder Dateien wählen':'Aus Galerie wählen')+'</button>'+
      '<button type="button" class="btn ghost" data-act="close">Abbrechen</button></div>');
  }
  else if(a==='photo-pick'){
    var cam=el.dataset.src==='camera';
    fileTarget={kind:el.dataset.kind,id:el.dataset.id};
    fileInput.accept=cam?'image/*':(el.dataset.kind==='doc'?'image/*,application/pdf':'image/*');
    if(cam)fileInput.setAttribute('capture','environment');else fileInput.removeAttribute('capture');
    fileInput.value='';fileInput.click();closeSheet();
  }
  else if(a==='photo-open')openPhoto(el.dataset.kind,el.dataset.id,Number(el.dataset.i));
  else if(a==='photo-del')deletePhoto(el.dataset.kind,el.dataset.id,Number(el.dataset.i));
});

/* ---------- notifications on the phone ----------
   Each phone signs up once ("Mitteilungen einschalten"); the reminder service then sends
   task reminders to every phone of the people a task is assigned to. */
var FN=(CFG.url||'')+'/functions/v1/erinnerungen';
var pushInfo={checked:false,on:false,busy:false};
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
function isIos(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function b64ToBytes(s){var p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function swReady(){
  /* wait for the app's background service; if it never comes, try starting it once more */
  return withTimeout(navigator.serviceWorker.ready,8000,'').catch(function(){
    return navigator.serviceWorker.register('sw.js').then(function(){return withTimeout(navigator.serviceWorker.ready,8000,'');});
  }).catch(function(e){throw {msg:'Der Hintergrunddienst der App startet auf diesem Handy nicht. Bitte App ganz schließen und neu öffnen. Hilft das nicht: App deinstallieren und über Chrome neu installieren.',detail:'Dienst: '+swState+(e&&e.message?', '+e.message:'')};});
}
function pushDiag(){
  var perm='Notification' in window?Notification.permission:'fehlt';
  var permDe={granted:'erlaubt',denied:'blockiert','default':'noch nicht gefragt'}[perm]||perm;
  return 'Stand '+APP_VERSION+' · Erlaubnis: '+permDe+' · Hintergrunddienst: '+(navigator.serviceWorker&&navigator.serviceWorker.controller?'aktiv':swState)+' · Push: '+('PushManager' in window?'ja':'nein')+' · '+(isStandalone()?'als App':'im Browser');
}

function checkPush(){
  if(!pushSupported()){pushInfo.checked=true;return;}
  swReady().then(function(reg){return reg.pushManager.getSubscription();}).then(function(s){
    pushInfo.checked=true;pushInfo.on=!!s&&Notification.permission==='granted';
    if(pushInfo.on&&sb&&state.me)saveSub(s).catch(function(e){if(window.console)console.error('Mitteilungen',e);});
    if(view==='aufgaben')render(true);
  }).catch(function(){pushInfo.checked=true;});
}
function pushSection(){
  var h='<section class="sec"><div class="sec-head"><h2>Mitteilungen aufs Handy</h2></div><div class="sit">';
  if(isIos()&&!isStandalone()){
    h+='<p>Am iPhone kommen Mitteilungen nur, wenn DJNP als App am Home-Bildschirm liegt: in <b>Safari</b> öffnen, unten auf Teilen tippen, dann „Zum Home-Bildschirm“. Danach DJNP über das Icon öffnen und hier einschalten.</p>';
  }else if(!pushSupported()){
    h+='<p>Dieser Browser kann keine Mitteilungen empfangen. Am Handy: Android mit Chrome, iPhone mit Safari und DJNP am Home-Bildschirm.</p>';
  }else if(Notification.permission==='denied'){
    h+='<p>Mitteilungen sind für DJNP auf diesem Gerät blockiert. Erlaube sie in den Einstellungen des Handys bei DJNP (Android: auch in Chrome unter Website-Einstellungen), dann öffne die App neu.</p>';
  }else if(pushInfo.on){
    h+='<p><span class="pill ok">Eingeschaltet</span> Dieses Gerät bekommt Erinnerungen für alle Aufgaben, bei denen du zuständig bist.</p>'+
      '<label class="row" style="padding:0;border:0;cursor:pointer" for="push-changes"><input class="check" type="checkbox" id="push-changes"'+(changesWanted()?' checked':'')+'><span class="grow">Auch Bescheid geben, wenn die anderen etwas eintragen oder ändern<span class="s" style="display:block">Termine, Einkauf, Essen, Aufgaben, Wer ist wo, Dokumente. Mehrere Änderungen kommen als eine Nachricht.</span></span></label>'+
      '<div class="acts" style="margin-top:0"><button type="button" class="btn small" data-act="push-test"'+(pushInfo.busy?' disabled':'')+'>Test-Mitteilung schicken</button><button type="button" class="btn small ghost" data-act="push-off"'+(pushInfo.busy?' disabled':'')+'>Ausschalten</button></div>';
  }else{
    h+='<p>Schalte Mitteilungen ein, damit du Bescheid bekommst, wenn eine deiner Aufgaben fällig wird. Das gilt für dieses Gerät, jedes Handy schaltet es selbst ein.</p>'+
      (pushInfo.step?'<p class="note">'+esc(pushInfo.step)+'</p>':'')+(pushInfo.err?'<p class="note warn">'+esc(pushInfo.err)+'</p>':'')+
      '<button type="button" class="btn primary" data-act="push-on"'+(pushInfo.busy?' disabled':'')+'>'+(pushInfo.busy?'Bitte warten …':'Mitteilungen einschalten')+'</button>';
  }
  h+='<p class="hint" style="font-size:.72rem">'+esc(pushDiag())+'</p>';
  h+='<p class="hint">Erinnerungen kommen ab 8 Uhr morgens an den Tagen, die du bei der Aufgabe wählst, und einmal am Tag nach der Frist, wenn noch nicht abgehakt ist.</p></div></section>';
  return h;
}
function setPushBusy(b){pushInfo.busy=b;if(view==='aufgaben')render(true);}
function withTimeout(promise,ms,msg){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej({msg:msg});},ms);
    Promise.resolve(promise).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
  });
}
function pushStep(text){pushInfo.step=text;pushInfo.err='';if(view==='aufgaben')render(true);}
/* keep the database in step with this phone: if the phone has a subscription, make sure it is saved */
function saveSub(s){
  return Promise.resolve(sb.from('push_subs').upsert([{endpoint:s.endpoint,person:state.me,sub:s.toJSON(),changes:changesWanted()}])).then(function(r){
    if(r.error)throw {msg:'Das Handy konnte nicht in der Datenbank angemeldet werden.',detail:r.error.message||String(r.error)};
  });
}
function enablePush(){
  setPushBusy(true);
  pushStep('Schritt 1 von 3: Erlaubnis wird angefragt. Bitte die Frage am Handy mit „Zulassen“ beantworten.');
  withTimeout(Notification.requestPermission(),45000,'Die Frage nach der Erlaubnis ist nicht erschienen oder wurde nicht beantwortet. Am Android: Einstellungen → Apps → DJNP (oder Chrome) → Benachrichtigungen erlauben, dann hier nochmal tippen.').then(function(p){
    if(p!=='granted')throw {msg:p==='denied'?'Mitteilungen wurden abgelehnt. Erlaube sie in den Einstellungen des Handys bei DJNP (Android: auch bei Chrome), dann hier nochmal tippen.':'Die Erlaubnis wurde nicht erteilt. Bitte nochmal tippen und „Zulassen“ wählen.'};
    pushStep('Schritt 2 von 3: Handy wird beim Mitteilungsdienst angemeldet …');
    return withTimeout(fetch(FN+'?key',{headers:{apikey:CFG.key}}).then(function(r){if(!r.ok)throw {msg:'Der Erinnerungsdienst ist gerade nicht erreichbar.',detail:'HTTP '+r.status};return r.json();}),20000,'Der Erinnerungsdienst antwortet nicht. Bitte Internetverbindung prüfen.');
  }).then(function(k){
    return withTimeout(swReady().then(function(reg){
      return reg.pushManager.getSubscription().then(function(old){return old?old.unsubscribe():null;}).then(function(){
        return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(k.publicKey)});
      });
    }),30000,'Das Handy hat die Anmeldung beim Mitteilungsdienst nicht abgeschlossen. Bitte App ganz schließen, neu öffnen und nochmal versuchen.');
  }).then(function(s){
    pushStep('Schritt 3 von 3: wird gespeichert …');
    return withTimeout(saveSub(s).catch(function(e){s.unsubscribe();throw e;}),20000,'Speichern dauert zu lange. Bitte Internetverbindung prüfen.');
  }).then(function(){
    pushInfo.on=true;pushInfo.step='';setPushBusy(false);toast('Mitteilungen sind eingeschaltet.');
  }).catch(function(e){
    pushInfo.step='';
    pushInfo.err=(e&&e.msg?e.msg:'Mitteilungen konnten nicht eingeschaltet werden.')+((e&&(e.detail||e.message))?' ('+(e.detail||e.message)+')':(e&&e.name?' ('+e.name+')':''));
    setPushBusy(false);
    if(window.console)console.error('Mitteilungen',e);
  });
}
function disablePush(quiet){
  if(!pushSupported())return Promise.resolve();
  if(!quiet)setPushBusy(true);
  return swReady().then(function(reg){return reg.pushManager.getSubscription();}).then(function(s){
    if(!s)return;
    var gone=sb?Promise.resolve(sb.from('push_subs').delete().eq('endpoint',s.endpoint)):Promise.resolve();
    return gone.then(function(){return s.unsubscribe();},function(){return s.unsubscribe();});
  }).then(function(){
    pushInfo.on=false;if(!quiet){setPushBusy(false);toast('Mitteilungen auf diesem Gerät ausgeschaltet.');}
  }).catch(function(){if(!quiet){setPushBusy(false);toast('Das hat nicht geklappt. Bitte nochmal versuchen.');}});
}
function testPush(){
  setPushBusy(true);
  Promise.resolve(sb.auth.getSession()).then(function(r){
    var tok=r&&r.data&&r.data.session?r.data.session.access_token:'';
    return fetch(FN+'?test',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+tok}});
  }).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
    setPushBusy(false);
    toast(x.ok&&x.j.sent?'Test-Mitteilung ist unterwegs.':'Es kam keine Mitteilung an. Bitte aus- und wieder einschalten.');
  }).catch(function(){setPushBusy(false);toast('Der Erinnerungsdienst ist gerade nicht erreichbar.');});
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act^="push-"]');if(!el)return;
  if(el.dataset.act==='push-on')enablePush();
  else if(el.dataset.act==='push-off')disablePush(false);
  else if(el.dataset.act==='push-test')testPush();
});
/* a phone that is signed out must not keep getting someone's reminders */
var signOutPlain=signOut;
signOut=function(){disablePush(true).then(signOutPlain,signOutPlain);};

/* ---------- messages about the others' changes ----------
   The database notices every change and the reminder service sends them out; this phone only
   decides whether it wants those messages. */
function changesWanted(){try{return localStorage.getItem(KEY+':changes')!=='0';}catch(e){return true;}}
function setChangesWanted(on){
  try{localStorage.setItem(KEY+':changes',on?'1':'0');}catch(e){}
  swReady().then(function(reg){return reg.pushManager.getSubscription();}).then(function(s){
    if(!s)return;
    return Promise.resolve(sb.from('push_subs').update({changes:on}).eq('endpoint',s.endpoint));
  }).then(function(){toast(on?'Du bekommst Bescheid, wenn die anderen etwas ändern.':'Keine Mitteilungen mehr bei Änderungen der anderen.');},function(){toast('Das hat nicht geklappt. Bitte nochmal versuchen.');});
}
document.addEventListener('change',function(e){if(e.target&&e.target.id==='push-changes')setChangesWanted(e.target.checked);});

checkPush();

})();
</script>
